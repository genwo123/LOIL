<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/static/js/viewtoggle.js"></script>
<title>로일(LoIl) 관리자 로그인</title>
<style>
  :root, :root[data-theme="dark"] {
    --bg: #1E1F22;
    --card: #2B2D31;
    --accent: #7C5CFC;
    --text: #FFFFFF;
    --text-gray: #B5BAC1;
    --blurple: #5865F2;
  }
  :root[data-theme="light"] {
    --bg: #F7F7FB;
    --card: #FFFFFF;
    --accent: #7C5CFC;
    --text: #1C1C28;
    --text-gray: #77778C;
    --blurple: #5865F2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 400px;
    width: 100%;
    background: var(--card);
    border-radius: 12px;
    border-left: 4px solid var(--accent);
    padding: 32px 28px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: var(--blurple);
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p { color: var(--text-gray); font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: var(--blurple);
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    font-weight: bold;
    padding: 12px 16px;
    border-radius: 8px;
  }
  .btn:hover { filter: brightness(1.08); }
  .hint { font-size: 12px; color: var(--text-gray); margin-top: 18px; margin-bottom: 0; opacity: 0.7; }
  .theme-toggle {
    position: fixed; top: 18px; right: 18px;
    background: var(--card); border: 1px solid var(--text-gray); color: var(--text);
    font-size: 11px; font-weight: bold; padding: 6px 10px; border-radius: 999px; cursor: pointer;
  }
  .back-home { position: fixed; top: 18px; left: 18px; font-size: 12px; color: var(--text-gray); text-decoration: none; }
  .back-home:hover { color: var(--text); }
</style>
</head>
<body>
  <a class="back-home" href="/">← 로일 홈</a>
  <button class="theme-toggle" onclick="loilToggleTheme()">🌙/☀️</button>
  <div class="card">
    <span class="badge">로일 · LoIl 관리자</span>
    <h1>일정 관리 로그인</h1>
    <p>길드장 · 부길드장만 로그인할 수 있습니다.<br>Discord 계정으로 로그인하면 관리 가능한 길드가 자동으로 확인됩니다.</p>
    <a class="btn" href="/login">Discord로 로그인</a>
    <p class="hint">일반 길드원은 로그인 없이 Discord에서 받은 링크로 조회하시면 됩니다.</p>
  </div>
  <script>
    function loilToggleTheme() {
      const html = document.documentElement;
      const cur = html.dataset.theme || 'dark';
      html.dataset.theme = cur === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('loil-theme', html.dataset.theme); } catch (e) {}
    }
    (function () {
      try {
        const saved = localStorage.getItem('loil-theme');
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    })();
  </script>
</body>
</html>
